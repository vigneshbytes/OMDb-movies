<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search</title>
    <script defer type="module" src="../assets/js/main.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <nav>
        <search class="searchEngine">
            <form action="./pages/search.html" method="GET">
                <input type="search" name="searchInput" placeholder="Movies, Series, etc." required minlength="1"
                    autocomplete="off" />
                <button type="submit"> Search </button>
            </form>
        </search>
    </nav>
    <main class="searchResults">

    </main>

    <template id="movie-card-template">
        <!-- Implicit landmark: no broken ID reference needed -->
        <article class="movie-card">

            <!-- Poster Container with Intrinsic Aspect Ratio & Zero-Latency SVG -->
            <div class="movie-card__poster-wrapper">
                <img class="movie-card__poster"
                    src="data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20300%20450%22%20width%3D%22300%22%20height%3D%22450%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%232a2a2a%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20fill%3D%22%23888888%22%20font-family%3D%22sans-serif%22%20font-size%3D%2218%22%20text-anchor%3D%22middle%22%20dy%3D%22.3em%22%3ENo%20Poster%20Available%3C%2Ftext%3E%3C%2Fsvg%3E"
                    alt="Movie poster" loading="lazy" decoding="async" width="300" />
            </div>

            <!-- Metadata Section -->
            <div class="movie-card__content">
                <h3 class="movie-card__title">Untitled Movie</h3>

                <p class="movie-card__meta">
                    <span class="movie-card__meta-label">Released:</span>
                    <!-- No empty datetime attribute by default -->
                    <time class="movie-card__year">Year Unknown</time>
                </p>
            </div>

        </article>
    </template>

</body>

</html>
